<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Assignment: Registration Page</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      max-width: 650px;
      margin: 20px auto;
      padding: 0 15px;
    }

    header, nav, main, footer {
      margin-bottom: 20px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 15px;
    }

    fieldset {
      padding: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-group label,
    .checkbox-group label {
      display: inline;
      font-weight: normal;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Semantic Header -->
  <header>
    <h1>ระบบสมัครสมาชิก</h1>
  </header>

  <!-- Semantic Nav -->
  <nav>
    <ul>
      <li><a href="#">หน้าแรก</a></li>
      <li><a href="#">สมัครสมาชิก</a></li>
      <li><a href="#">เข้าสู่ระบบ</a></li>
    </ul>
  </nav>

  <!-- Semantic Main -->
  <main>
    <h2>แบบฟอร์มลงทะเบียน</h2>

    <form action="#" method="post">

      <!-- Fieldset & Legend Group -->
      <fieldset>
        <legend>ข้อมูลส่วนตัวและบัญชีผู้ใช้</legend>

        <!-- Field 1: Text Input -->
        <div class="form-group">
          <label for="username">ชื่อผู้ใช้ (Username):</label>
          <input type="text" id="username" name="username" required minlength="4">
        </div>

        <!-- Field 2: Email Input -->
        <div class="form-group">
          <label for="email">อีเมล (Email):</label>
          <input type="email" id="email" name="email" required>
        </div>

        <!-- Field 3: Password Input -->
        <div class="form-group">
          <label for="password">รหัสผ่าน (Password):</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>

        <!-- Field 4: Date Input -->
        <div class="form-group">
          <label for="dob">วันเกิด (Date of Birth):</label>
          <input type="date" id="dob" name="dob" required min="1900-01-01" max="2026-12-31">
        </div>

        <!-- Field 5: Radio Buttons -->
        <div class="form-group">
          <label>เพศ (Gender):</label>
          <div class="radio-group">
            <div>
              <input type="radio" id="gender-male" name="gender" value="male" required>
              <label for="gender-male">ชาย</label>
            </div>
            <div>
              <input type="radio" id="gender-female" name="gender" value="female">
              <label for="gender-female">หญิง</label>
            </div>
            <div>
              <input type="radio" id="gender-other" name="gender" value="other">
              <label for="gender-other">อื่นๆ</label>
            </div>
          </div>
        </div>

      </fieldset>

      <!-- Field 6: Checkbox Input -->
      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">ฉันยอมรับเงื่อนไขและข้อตกลงการใช้งาน</label>
      </div>

      <!-- Submit Button -->
      <button type="submit">ลงทะเบียน</button>

    </form>
  </main>

  <!-- Semantic Footer -->
  <footer>
    <p>&copy; 2026 Full Stack Web Development Lab Assignment.</p>
  </footer>

</body>
</html>
